[project]
name = "advthinking"
version = "0.1.0"
description = "advthinking"
requires-python = ">=3.12.9,<3.13"
dependencies = [
    "nltk>=3.9.1",
    "sacremoses>=0.1.1",
    "unidecode>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["advthinking"]

[tool.rye]
managed = true
dev-dependencies = [
    "ruff",
]

[tool.hatch.metadata]
allow-direct-references = true

